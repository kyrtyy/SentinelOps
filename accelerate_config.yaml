# 2x GPU single-node DDP training config for `accelerate launch
# --config_file configs/accelerate_config.yaml`.
#
# LoRA on a 7-8B model in bf16 fits comfortably on a single 24GB GPU,
# so plain DDP (each process holds a full replica) is enough - no
# DeepSpeed ZeRO sharding needed at this scale. Regenerate with
# `accelerate config` if your GPU count or topology differs.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
