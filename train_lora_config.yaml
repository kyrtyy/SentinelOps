# SentinelOps LoRA SFT config. Edit values here - train_ddp.py reads
# everything from this file, so hyperparameters live in one place
# instead of being scattered across CLI flags.

model:
  # Either of the spec's candidate base models works out of the box -
  # TRL auto-patches both chat templates for assistant_only_loss.
  name_or_path: "Qwen/Qwen2.5-Coder-7B-Instruct"
  # name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  max_seq_length: 4096
  attn_implementation: "flash_attention_2"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/sft_train.jsonl"
  eval_file: "data/sft_val.jsonl"

training:
  output_dir: "outputs/sentinelops-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch = 2 * 8 * num_gpus (32 on 2 GPUs)
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  seed: 13
  assistant_only_loss: true
  packing: false
  report_to: "wandb"       # set to "none" if you don't want W&B
  run_name: "sentinelops-lora-v1"

wandb:
  project: "sentinelops"
